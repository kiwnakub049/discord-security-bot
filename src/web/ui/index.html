<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- รูปเซิร์ฟ Discord (server ส่งต่อให้ ไม่มีรูปเซิร์ฟ = icon.svg เดิม) -->
    <link rel="icon" href="/server-icon" />
    <link rel="apple-touch-icon" href="/server-icon" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) ในซีเอสเอส = แถบล่างไม่โดนขีดโฮมของ iPhone บัง -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- เพิ่มลงหน้าโฮมแล้วเปิดเต็มจอเหมือนแอป -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iPhone ต้อง "เพิ่มลงหน้าโฮม" ก่อนถึงรับแจ้งเตือนได้ — manifest บอกชื่อ/ไอคอน/เปิดเต็มจอ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Undawn Dashboard" />
    <!-- สีแถบสถานะบนมือถือ ตามธีมที่เครื่องตั้งไว้ -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1726" />
    <title>Undawn Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
