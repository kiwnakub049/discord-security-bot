<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/server-icon" />
    <link rel="apple-touch-icon" href="/server-icon" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1726" />
    <title>เข้าสู่ระบบ — Undawn Dashboard</title>
    <!--
      หน้านี้จงใจไม่ใช้ React/Vite เหมือนหน้าอื่น
      เพราะต้องเข้าถึงได้ "ก่อน" login — มีแค่ปุ่มเดียวที่เป็นลิงก์ธรรมดาไป /auth/discord
      (login ด้วย Discord อย่างเดียว ไม่มีรหัสผ่านแล้ว)
      สีเลยต้องก็อปชุดเดียวกับ ui/src/index.css มาไว้ที่นี่ — ถ้าแก้ธีม แก้ทั้งสองที่

      ⚠️ ห้ามมี <script> ในไฟล์นี้ — CSP ตั้ง script-src 'self' ไว้ จะถูกบล็อกเงียบ ๆ
         animation ทุกอย่างจึงต้องเป็น CSS ล้วน (test/loginpage.test.ts คุมข้อนี้อยู่)
    -->
    <style>
      /*
       * ── โทนสว่าง: กระดาษกับหมึก ── (ชุดเดียวกับ dashboard — src/web/ui/src/index.css)
       * พื้นหลังก้อนสีเดิม (blob) ปิดไว้ด้วยการตั้งเป็นโปร่งใส ไม่ต้องรื้อ markup
       */
      :root {
        color-scheme: light;
        --bg: #eef1f4;
        --blob-1: transparent;
        --blob-2: transparent;
        --blob-3: transparent;
        --blob-4: transparent;
        --glass: #fbfcfd;
        --edge: #c9d2dc;
        --spec: transparent;
        --shade: rgba(20, 33, 61, 0.12);
        --field: #fbfcfd;
        --text: #14213d;
        --muted: #44526b;
        --accent: #2f5d8a;
        --accent-contrast: #fbfcfd;
        --alert: #c8102e;
        --alert-soft: rgba(200, 16, 46, 0.09);
      }

      /* ── โทนมืด: เวรกลางคืน ── */
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0f1726;
          --blob-1: transparent;
          --blob-2: transparent;
          --blob-3: transparent;
          --blob-4: transparent;
          --glass: #152036;
          --edge: #283653;
          --spec: transparent;
          --shade: rgba(0, 0, 0, 0.5);
          --field: #1c2a44;
          --text: #dce3ea;
          --muted: #a8b4c6;
          --accent: #8db3da;
          --accent-contrast: #0f1726;
          --alert: #ff6b7d;
          --alert-soft: rgba(255, 107, 125, 0.13);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background: var(--bg);
      }

      body {
        font-family: "Sarabun", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
        -webkit-font-smoothing: antialiased;
      }

      /* พื้นไล่สีที่ขยับช้า ๆ — ตัวเดียวกับที่หน้าอื่นใช้ ทำให้กระจกมีอะไรให้เห็นทะลุ */
      .aurora {
        position: fixed;
        inset: -25%;
        z-index: -1;
        pointer-events: none;
        background-color: var(--bg);
        background-image:
          radial-gradient(38% 32% at 18% 18%, var(--blob-1), transparent 68%),
          radial-gradient(34% 30% at 84% 12%, var(--blob-2), transparent 68%),
          radial-gradient(42% 38% at 74% 82%, var(--blob-3), transparent 70%),
          radial-gradient(32% 30% at 24% 78%, var(--blob-4), transparent 70%);
        animation: drift 48s ease-in-out infinite alternate;
        will-change: transform;
      }

      .card {
        width: 100%;
        max-width: 380px;
        padding: 30px 26px;
        border-radius: 24px;
        background: var(--glass);
        backdrop-filter: blur(32px) saturate(190%);
        -webkit-backdrop-filter: blur(32px) saturate(190%);
        border: 1px solid var(--edge);
        /* เส้นแสงขอบบน = ขอบที่หันรับแสง ทำให้ดูเป็นแผ่นมีความหนา ไม่ใช่กล่องแบน */
        box-shadow:
          inset 0 1px 0 0 var(--spec),
          0 24px 64px -24px var(--shade);
        animation: rise 0.6s cubic-bezier(0.22, 1.2, 0.36, 1) both;
      }

      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px; /* รูปเซิร์ฟเป็นสี่เหลี่ยมเต็ม — มนมุมให้เข้ากับการ์ด */
        object-fit: cover;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 24px;
      }

      /* สีปุ่มของ Discord เอง (Blurple) — คนเห็นแล้วรู้ทันทีว่ากดแล้วไปไหน */
      .discord {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        background: #5865f2;
        color: #fff;
        text-decoration: none;
        border: none;
        border-radius: 14px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
          0 6px 18px -8px #5865f2;
        transition: transform 0.18s cubic-bezier(0.22, 1.2, 0.36, 1);
      }
      .discord:active {
        transform: scale(0.975);
      }

      .discord svg {
        width: 22px;
        height: 22px;
        flex: none;
      }

      .note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        margin-top: 16px;
        text-align: center;
      }

      .error {
        background: var(--alert-soft);
        border: 1px solid var(--alert);
        border-radius: 14px;
        color: var(--alert);
        font-size: 13px;
        line-height: 1.5;
        padding: 11px 14px;
        margin-bottom: 18px;
        animation: rise 0.45s cubic-bezier(0.22, 1.2, 0.36, 1) both;
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(2.5%, -2%, 0) scale(1.09);
        }
        100% {
          transform: translate3d(-2%, 2.5%, 0) scale(1.04);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

    <main class="card">
      <img class="logo" src="/server-icon" alt="" />
      <h1>Undawn Dashboard</h1>
      <p class="sub">เข้าสู่ระบบเพื่อดูแลเซิร์ฟเวอร์</p>

      <!--ERROR-->

      <!--ACTION-->
      <a class="discord" href="/auth/discord">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M20.32 4.37A19.8 19.8 0 0 0 15.4 2.85a13.7 13.7 0 0 0-.63 1.29 18.4 18.4 0 0 0-5.5 0 13.6 13.6 0 0 0-.64-1.29 19.7 19.7 0 0 0-4.93 1.52C.6 9.05-.24 13.6.18 18.1a19.9 19.9 0 0 0 6.04 3.05c.49-.66.92-1.36 1.29-2.1a12.9 12.9 0 0 1-2.03-.97l.5-.39a14.2 14.2 0 0 0 12.06 0l.5.39c-.65.38-1.33.71-2.04.97.37.74.8 1.44 1.29 2.1a19.8 19.8 0 0 0 6.04-3.05c.5-5.2-.84-9.72-3.51-13.73ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.96 2.42-2.16 2.42Zm7.96 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.22 0 2.18 1.1 2.16 2.42 0 1.34-.94 2.42-2.16 2.42Z" />
        </svg>
        เข้าสู่ระบบด้วย Discord
      </a>
      <p class="note">หรือพิมพ์ <b>/dashboard</b> ในเซิร์ฟ Discord แล้วกดลิงก์ที่บอทส่งให้</p>
      <!--/ACTION-->

      <p class="note">เข้าได้เฉพาะคนที่มียศแอดมินหรือ mod ในเซิร์ฟเวอร์</p>
    </main>
  </body>
</html>
